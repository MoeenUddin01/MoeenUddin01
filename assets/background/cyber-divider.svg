<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 20" width="100%" height="20">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="35%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="1"/>
      <stop offset="65%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <filter id="divGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <line x1="10" y1="10" x2="910" y2="10" stroke="url(#divGrad)" stroke-width="1.5" filter="url(#divGlow)"/>
  <polygon points="460,4 466,10 460,16 454,10" fill="#a855f7" filter="url(#divGlow)">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </polygon>
  <circle cx="430" cy="10" r="2.5" fill="#00f0ff"/>
  <circle cx="490" cy="10" r="2.5" fill="#00f0ff"/>
</svg>
