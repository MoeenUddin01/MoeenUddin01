<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 120" width="100%" height="100%">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#070b19"/>
      <stop offset="50%" stop-color="#0c102c"/>
      <stop offset="100%" stop-color="#070b19"/>
    </linearGradient>
    <linearGradient id="footerBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <filter id="fGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .star-twinkle {
      animation: twinkle 2s ease-in-out infinite alternate;
    }
    @keyframes twinkle {
      0% { opacity: 0.3; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.2); }
    }
  </style>

  <!-- Chassis -->
  <rect x="4" y="4" width="912" height="112" rx="14" fill="url(#footerBg)" stroke="url(#footerBorder)" stroke-width="1.8" filter="url(#fGlow)"/>

  <!-- Left Pixel Terminal Prompt -->
  <g transform="translate(30, 48)">
    <rect x="0" y="0" width="180" height="24" rx="4" fill="#030712" stroke="#a855f7" stroke-width="0.8"/>
    <text x="12" y="16" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="700">moeen@core:~$ run --ai</text>
  </g>

  <!-- Center "KEEP CODING!" Pixel-Arcade Style Banner -->
  <g transform="translate(330, 48)">
    <text x="130" y="24" text-anchor="middle" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="4">KEEP CODING! 🚀</text>
  </g>

  <!-- Right Pixel Heart & Stars -->
  <g transform="translate(730, 42)">
    <!-- Pixel Heart -->
    <path d="M 12 6 H 18 V 12 H 12 Z M 24 6 H 30 V 12 H 24 Z M 6 12 H 36 V 18 H 6 Z M 6 18 H 36 V 24 H 6 Z M 12 24 H 30 V 30 H 12 Z M 18 30 H 24 V 36 H 18 Z" fill="#ec4899" filter="url(#fGlow)">
      <animateTransform attributeName="transform" type="scale" values="1; 1.08; 1" dur="1.2s" repeatCount="indefinite" transform-origin="21 21"/>
    </path>

    <!-- Pixel Stars -->
    <rect x="55" y="10" width="4" height="4" fill="#00f0ff" class="star-twinkle"/>
    <rect x="80" y="26" width="6" height="6" fill="#facc15" class="star-twinkle" style="animation-delay: 0.6s;"/>
    <rect x="110" y="8" width="5" height="5" fill="#a855f7" class="star-twinkle" style="animation-delay: 1.2s;"/>
  </g>

  <!-- Technical Metric Coordinates at Bottom -->
  <text x="460" y="104" text-anchor="middle" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" letter-spacing="2">
    SYSTEM INTEGRITY: 100% // CONTINUOUS LEARNING AGENT // LATENCY: 12ms
  </text>

  <!-- Cyber Corners -->
  <path d="M 4 20 L 4 4 L 20 4" fill="none" stroke="#a855f7" stroke-width="2.5"/>
  <path d="M 916 20 L 916 4 L 900 4" fill="none" stroke="#00f0ff" stroke-width="2.5"/>
  <path d="M 4 100 L 4 116 L 20 116" fill="none" stroke="#00f0ff" stroke-width="2.5"/>
  <path d="M 916 100 L 916 116 L 900 116" fill="none" stroke="#a855f7" stroke-width="2.5"/>
</svg>
