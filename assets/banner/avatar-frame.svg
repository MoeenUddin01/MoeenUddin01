<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <filter id="frameGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Outer Neon Rings -->
  <circle cx="80" cy="80" r="74" fill="none" stroke="url(#frameGrad)" stroke-width="2.5" filter="url(#frameGlow)"/>
  <circle cx="80" cy="80" r="68" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.8"/>
  <circle cx="80" cy="80" r="62" fill="none" stroke="#00f0ff" stroke-width="1.2" opacity="0.9"/>
  <!-- Corner Tech Accent Decals -->
  <path d="M 12 30 L 12 12 L 30 12" fill="none" stroke="#00f0ff" stroke-width="2.5"/>
  <path d="M 148 30 L 148 12 L 130 12" fill="none" stroke="#a855f7" stroke-width="2.5"/>
  <path d="M 12 130 L 12 148 L 30 148" fill="none" stroke="#a855f7" stroke-width="2.5"/>
  <path d="M 148 130 L 148 148 L 130 148" fill="none" stroke="#00f0ff" stroke-width="2.5"/>
</svg>
