<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 940 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="40%" stop-color="#070b19"/>
      <stop offset="80%" stop-color="#0c102a"/>
      <stop offset="100%" stop-color="#070b19"/>
    </linearGradient>

    <!-- Neon Rim Border -->
    <linearGradient id="heroBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Text Gradients -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#e0f2fe"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>

    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>

    <!-- Aquarium Water Gradient inside Banner -->
    <linearGradient id="tankWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#0369a1" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="koiRed2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="100%" stop-color="#ff9900"/>
    </linearGradient>

    <linearGradient id="koiWhite2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>

    <!-- Glow filters -->
    <filter id="neonGlowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="neonGlowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Clip Path for Circular Avatar -->
    <clipPath id="avatarClip">
      <circle cx="115" cy="140" r="54"/>
    </clipPath>
  </defs>

  <style>
    @keyframes pulseRing {
      0% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 0.3; }
      100% { transform: scale(1); opacity: 0.8; }
    }
    @keyframes dashRotate {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 360; }
    }
    .rotating-ring {
      transform-origin: 115px 140px;
      stroke-dasharray: 8 6;
      animation: dashRotate 20s linear infinite;
    }
    .bubble-up {
      animation: bubbleRise 3.5s linear infinite;
    }
    @keyframes bubbleRise {
      0% { transform: translateY(0); opacity: 0; }
      15% { opacity: 0.8; }
      85% { opacity: 0.7; }
      100% { transform: translateY(-180px); opacity: 0; }
    }
    .plant-sway {
      transform-origin: 600px 300px;
      animation: swayP 5s ease-in-out infinite alternate;
    }
    @keyframes swayP {
      0% { transform: rotate(-3deg); }
      100% { transform: rotate(3deg); }
    }
  </style>

  <!-- Canvas Background -->
  <rect x="5" y="5" width="930" height="370" rx="20" fill="url(#bgGrad)" stroke="url(#heroBorder)" stroke-width="2"/>

  <!-- Cybernetic Grid Pattern Overlay -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="0.7">
    <line x1="5" y1="60" x2="935" y2="60"/>
    <line x1="5" y1="120" x2="935" y2="120"/>
    <line x1="5" y1="180" x2="935" y2="180"/>
    <line x1="5" y1="240" x2="935" y2="240"/>
    <line x1="5" y1="300" x2="935" y2="300"/>
    <line x1="160" y1="5" x2="160" y2="375"/>
    <line x1="320" y1="5" x2="320" y2="375"/>
    <line x1="480" y1="5" x2="480" y2="375"/>
    <line x1="640" y1="5" x2="640" y2="375"/>
    <line x1="800" y1="5" x2="800" y2="375"/>
  </g>

  <!-- Ambient Glow Blobs -->
  <circle cx="115" cy="140" r="120" fill="#a855f7" opacity="0.18" filter="url(#neonGlowPurple)"/>
  <circle cx="730" cy="190" r="160" fill="#0284c7" opacity="0.2" filter="url(#neonGlowCyan)"/>

  <!-- Top System Header Bar -->
  <g transform="translate(30, 25)">
    <circle cx="6" cy="6" r="4.5" fill="#ef4444"/>
    <circle cx="22" cy="6" r="4.5" fill="#f59e0b"/>
    <circle cx="38" cy="6" r="4.5" fill="#10b981"/>
    <text x="60" y="10" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="600" letter-spacing="1">SYSTEM_ID: MOEEN_UDDIN // NODE_AI_CORE_ONLINE</text>
    <rect x="730" y="-3" width="145" height="18" rx="4" fill="#070b19" stroke="#10b981" stroke-width="0.8"/>
    <circle cx="740" cy="6" r="3" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="750" y="9.5" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="700" letter-spacing="1">PORTFOLIO LIVE</text>
  </g>

  <!-- ==================== LEFT SECTION: AVATAR & INTRO ==================== -->
  
  <!-- Outer Pulsing Neon Rings for Avatar -->
  <circle cx="115" cy="140" r="64" fill="none" stroke="url(#ringGrad1)" stroke-width="2" opacity="0.85" filter="url(#neonGlowCyan)"/>
  <circle cx="115" cy="140" r="70" fill="none" stroke="#a855f7" stroke-width="1.5" class="rotating-ring" opacity="0.7"/>

  <!-- Avatar Background & Fallback -->
  <circle cx="115" cy="140" r="54" fill="#0b0f24" stroke="#00f0ff" stroke-width="2"/>
  
  <!-- Self-Contained Vector Cybernetic Avatar Graphic -->
  <g transform="translate(115, 140)">
    <!-- Neural Node Backing -->
    <circle cx="0" cy="0" r="48" fill="#070b19"/>
    <!-- Cybernetic Head Silhouette -->
    <circle cx="0" cy="-10" r="16" fill="none" stroke="#00f0ff" stroke-width="2.2" filter="url(#neonGlowCyan)"/>
    <circle cx="0" cy="-10" r="14" fill="#0b112c"/>
    <path d="M -8 -9 L 8 -9" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Shoulders & Cyber Collar -->
    <path d="M -30 28 C -28 10 -16 6 0 6 C 16 6 28 10 30 28 Z" fill="none" stroke="#a855f7" stroke-width="2.2" filter="url(#neonGlowPurple)"/>
    <path d="M -28 28 C -26 12 -14 8 0 8 C 14 8 26 12 28 28 Z" fill="#0b112c"/>
    <!-- Core Circuit Lines -->
    <line x1="0" y1="8" x2="0" y2="28" stroke="#00f0ff" stroke-width="1.8"/>
    <line x1="-12" y1="16" x2="-22" y2="24" stroke="#a855f7" stroke-width="1.5"/>
    <line x1="12" y1="16" x2="22" y2="24" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="0" cy="18" r="3" fill="#00f0ff"/>
  </g>

  <!-- Real-Time Status Pill -->
  <g transform="translate(48, 208)">
    <rect x="0" y="0" width="134" height="22" rx="11" fill="#070b19" stroke="#00f0ff" stroke-width="1"/>
    <circle cx="12" cy="11" r="4" fill="#00f0ff">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="22" y="14.5" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">AGENTIC ENG</text>
  </g>

  <!-- Introduction Texts -->
  <g transform="translate(205, 105)">
    <!-- Small Greeting Tag -->
    <rect x="0" y="0" width="130" height="20" rx="4" fill="#1e1b4b" stroke="#a855f7" stroke-width="0.8"/>
    <text x="10" y="14" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="1">WELCOME TO MY HQ</text>
    
    <!-- Main Headline: Hi, I'm Moeen 👋 -->
    <text x="0" y="58" fill="url(#nameGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5">Hi, I'm Moeen 👋</text>
    
    <!-- AI Engineer Subtitle -->
    <text x="0" y="86" fill="url(#subGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="1.2">AI SYSTEMS &amp; AUTONOMOUS AGENTS ENGINEER</text>
    
    <!-- Core Focus -->
    <text x="0" y="112" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
      Multi-Agent Architectures <tspan fill="#38bdf8">•</tspan> Spec-Driven RAG <tspan fill="#a855f7">•</tspan> Edge Robotics
    </text>

    <!-- Futuristic Tech Chips -->
    <g transform="translate(0, 134)">
      <!-- Chip 1 -->
      <rect x="0" y="0" width="65" height="22" rx="4" fill="#0f172a" stroke="#00f0ff" stroke-width="0.8"/>
      <text x="9" y="15" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10" font-weight="700">PYTHON</text>

      <!-- Chip 2 -->
      <rect x="73" y="0" width="75" height="22" rx="4" fill="#0f172a" stroke="#a855f7" stroke-width="0.8"/>
      <text x="82" y="15" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10" font-weight="700">PYTORCH</text>

      <!-- Chip 3 -->
      <rect x="156" y="0" width="90" height="22" rx="4" fill="#0f172a" stroke="#00f0ff" stroke-width="0.8"/>
      <text x="165" y="15" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10" font-weight="700">LANGGRAPH</text>

      <!-- Chip 4 -->
      <rect x="254" y="0" width="68" height="22" rx="4" fill="#0f172a" stroke="#a855f7" stroke-width="0.8"/>
      <text x="263" y="15" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10" font-weight="700">FASTAPI</text>
    </g>
  </g>

  <!-- ==================== RIGHT SECTION: INTEGRATED GLASS AQUARIUM ==================== -->
  
  <g transform="translate(565, 60)">
    <!-- Aquarium Outer Ambient Glow -->
    <rect x="-8" y="-8" width="356" height="276" rx="22" fill="#00f0ff" opacity="0.08" filter="url(#neonGlowCyan)"/>

    <!-- Aquarium Base Tank -->
    <rect x="0" y="0" width="340" height="260" rx="18" fill="url(#tankWater)" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Water Surface Shimmer -->
    <ellipse cx="170" cy="16" rx="145" ry="5" fill="#38bdf8" opacity="0.3"/>

    <!-- Aquatic Plants in Corner -->
    <g class="plant-sway">
      <path d="M 40 245 Q 25 170 50 110 Q 55 170 45 245" fill="none" stroke="#00f0ff" stroke-width="2.5" opacity="0.7"/>
      <path d="M 52 245 Q 70 180 58 125 Q 48 185 52 245" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
      <path d="M 300 245 Q 320 160 295 105 Q 288 165 295 245" fill="none" stroke="#a855f7" stroke-width="2.5" opacity="0.7"/>
    </g>

    <!-- Rising Bubbles -->
    <circle cx="65" cy="220" r="2.5" fill="#e0f2fe" opacity="0.8" class="bubble-up" style="animation-delay: 0s;"/>
    <circle cx="80" cy="235" r="3.5" fill="#38bdf8" opacity="0.6" class="bubble-up" style="animation-delay: 1.5s;"/>
    <circle cx="280" cy="225" r="3" fill="#00f0ff" opacity="0.7" class="bubble-up" style="animation-delay: 0.8s;"/>
    <circle cx="295" cy="240" r="2" fill="#c084fc" opacity="0.8" class="bubble-up" style="animation-delay: 2.2s;"/>

    <!-- Animated Swimming Koi 1 (Kohaku Red/White) -->
    <g>
      <animateMotion dur="12s" repeatCount="indefinite" rotate="auto" path="M 260 120 C 180 80 100 90 70 140 C 40 185 80 215 150 205 C 230 190 290 180 295 135 C 300 95 280 90 260 120 Z"/>
      <g transform="scale(0.7)">
        <!-- Tail -->
        <path d="M -25 0 C -38 -10 -46 -2 -42 0 C -46 2 -38 10 -25 0 Z" fill="url(#koiWhite2)"/>
        <!-- Fins -->
        <path d="M 4 -5 C 6 -14 -3 -17 -5 -8 Z" fill="url(#koiWhite2)" opacity="0.8"/>
        <path d="M 4 5 C 6 14 -3 17 -5 8 Z" fill="url(#koiWhite2)" opacity="0.8"/>
        <!-- Body -->
        <path d="M -26 0 C -20 -9 10 -10 24 0 C 10 10 -20 9 -26 0 Z" fill="url(#koiWhite2)"/>
        <!-- Red Patches -->
        <path d="M -14 -3 C -8 -7 2 -6 6 -2 C 2 2 -8 3 -14 -3 Z" fill="url(#koiRed2)"/>
        <path d="M 10 -3 C 15 -5 20 -4 18 0 C 16 3 12 4 10 -3 Z" fill="url(#koiRed2)"/>
        <circle cx="21" cy="-3" r="1.2" fill="#0f172a"/>
        <circle cx="21" cy="3" r="1.2" fill="#0f172a"/>
      </g>
    </g>

    <!-- Animated Swimming Koi 2 (Electric Asagi Blue) -->
    <g>
      <animateMotion dur="15s" begin="-5s" repeatCount="indefinite" rotate="auto" path="M 80 90 C 140 60 240 70 270 110 C 300 150 260 195 180 200 C 100 205 50 170 55 125 C 60 95 70 90 80 90 Z"/>
      <g transform="scale(0.58) rotate(180)">
        <path d="M -25 0 C -38 -10 -46 -2 -42 0 C -46 2 -38 10 -25 0 Z" fill="#38bdf8"/>
        <path d="M -26 0 C -20 -9 10 -10 24 0 C 10 10 -20 9 -26 0 Z" fill="#00f0ff"/>
        <path d="M -12 -3 C -6 -6 0 -5 5 -2 C 0 2 -6 3 -12 -3 Z" fill="#1e1b4b"/>
      </g>
    </g>

    <!-- Glass Reflection Highlights -->
    <path d="M 8 10 Q 25 130 8 250 L 25 250 Q 40 130 25 10 Z" fill="#ffffff" opacity="0.1"/>
    
    <!-- Neon Glass Rim -->
    <rect x="0" y="0" width="340" height="260" rx="18" fill="none" stroke="url(#ringGrad1)" stroke-width="2" filter="url(#neonGlowCyan)"/>

    <!-- Aquarium Corner Accents -->
    <path d="M 0 25 L 0 0 L 25 0" fill="none" stroke="#00f0ff" stroke-width="3"/>
    <path d="M 340 25 L 340 0 L 315 0" fill="none" stroke="#a855f7" stroke-width="3"/>
    <path d="M 0 235 L 0 260 L 25 260" fill="none" stroke="#a855f7" stroke-width="3"/>
    <path d="M 340 235 L 340 260 L 315 260" fill="none" stroke="#00f0ff" stroke-width="3"/>

    <!-- Aquarium Badge -->
    <g transform="translate(15, 15)">
      <rect x="0" y="0" width="130" height="18" rx="4" fill="#070b19" fill-opacity="0.85" stroke="#00f0ff" stroke-width="0.8"/>
      <circle cx="8" cy="9" r="3" fill="#00f0ff"/>
      <text x="18" y="12.5" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="8.5" font-weight="700" letter-spacing="1">GLASS AQUARIUM // LIVE</text>
    </g>
  </g>

  <!-- Futuristic Border Corners on Canvas -->
  <path d="M 5 35 L 5 5 L 35 5" fill="none" stroke="#00f0ff" stroke-width="4"/>
  <path d="M 935 35 L 935 5 L 905 5" fill="none" stroke="#a855f7" stroke-width="4"/>
  <path d="M 5 345 L 5 375 L 35 375" fill="none" stroke="#a855f7" stroke-width="4"/>
  <path d="M 935 345 L 935 375 L 905 375" fill="none" stroke="#00f0ff" stroke-width="4"/>
</svg>
