<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 190" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg_1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19"/>
      <stop offset="60%" stop-color="#0a0f26"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    <linearGradient id="borderGrad_1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="cardGlow_1" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Card Chassis -->
  <rect x="4" y="4" width="442" height="182" rx="14" fill="url(#cardBg_1)" stroke="url(#borderGrad_1)" stroke-width="1.6" filter="url(#cardGlow_1)"/>

  <!-- Top Cyber Accent Bar -->
  <path d="M 18 4 L 80 4 L 90 14 L 18 14 Z" fill="#00F0FF" opacity="0.85"/>
  <text x="24" y="12" fill="#070b19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="7.5" font-weight="900" letter-spacing="1">FEATURED</text>

  <!-- Category & Status Line -->
  <g transform="translate(20, 34)">
    <text x="0" y="0" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="8.5" font-weight="700" letter-spacing="1">KNOWLEDGE RETRIEVAL • ENTERPRISE RAG</text>
    
    <!-- Status Pill -->
    <rect x="300" y="-10" width="110" height="15" rx="3" fill="#030712" stroke="#00F0FF" stroke-width="0.8"/>
    <circle cx="308" cy="-2.5" r="2.5" fill="#00F0FF"/>
    <text x="316" y="0" fill="#00F0FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="7.5" font-weight="700" letter-spacing="0.5">ACTIVE BENCHMARK</text>
  </g>

  <!-- Project Icon & Title Header -->
  <g transform="translate(20, 48)">
    <g transform="translate(0, 0)">
      <rect x="6" y="6" width="20" height="20" rx="4" fill="none" stroke="#00F0FF" stroke-width="2"/><path d="M10 12h12M10 16h8M10 20h10" stroke="#00F0FF" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <text x="38" y="21" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" letter-spacing="0.2">SpecRAG // Context Engine</text>
  </g>

  <!-- Project Description (wrapped visually) -->
  <g transform="translate(20, 88)">
    <text x="0" y="14" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" width="410">
      <tspan x="0" dy="0">Modular, spec-driven RAG architecture for intelligent document retrieval,</tspan>
      <tspan x="0" dy="16">multi-stage reranking, and high-precision LLM context engineering.</tspan>
    </text>
  </g>

  <!-- Technology Tags Footer -->
  <g transform="translate(20, 142)">
    
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="61.0" height="20" rx="4" fill="#0f172a" stroke="#00F0FF" stroke-width="0.8"/>
          <text x="30.5" y="13.5" text-anchor="middle" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="700">Python</text>
        </g>
        
        <g transform="translate(69.0, 0)">
          <rect x="0" y="0" width="113.5" height="20" rx="4" fill="#0f172a" stroke="#00F0FF" stroke-width="0.8"/>
          <text x="56.75" y="13.5" text-anchor="middle" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="700">Hybrid Search</text>
        </g>
        
        <g transform="translate(190.5, 0)">
          <rect x="0" y="0" width="76.0" height="20" rx="4" fill="#0f172a" stroke="#00F0FF" stroke-width="0.8"/>
          <text x="38.0" y="13.5" text-anchor="middle" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="700">VectorDB</text>
        </g>
        
        <g transform="translate(274.5, 0)">
          <rect x="0" y="0" width="83.5" height="20" rx="4" fill="#0f172a" stroke="#00F0FF" stroke-width="0.8"/>
          <text x="41.75" y="13.5" text-anchor="middle" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="700">LangChain</text>
        </g>
        
  </g>

  <!-- Corner Decals -->
  <path d="M 4 25 L 4 4 L 25 4" fill="none" stroke="#00F0FF" stroke-width="2.5"/>
  <path d="M 446 25 L 446 4 L 425 4" fill="none" stroke="#00F0FF" stroke-width="2.5"/>
  <path d="M 4 165 L 4 186 L 25 186" fill="none" stroke="#00F0FF" stroke-width="2.5"/>
  <path d="M 446 165 L 446 186 L 425 186" fill="none" stroke="#00F0FF" stroke-width="2.5"/>
</svg>