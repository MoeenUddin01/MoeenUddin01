<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 190" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg_0" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19"/>
      <stop offset="60%" stop-color="#0a0f26"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    <linearGradient id="borderGrad_0" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="cardGlow_0" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Card Chassis -->
  <rect x="4" y="4" width="442" height="182" rx="14" fill="url(#cardBg_0)" stroke="url(#borderGrad_0)" stroke-width="1.6" filter="url(#cardGlow_0)"/>

  <!-- Top Cyber Accent Bar -->
  <path d="M 18 4 L 80 4 L 90 14 L 18 14 Z" fill="#A855F7" opacity="0.85"/>
  <text x="24" y="12" fill="#070b19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="7.5" font-weight="900" letter-spacing="1">FEATURED</text>

  <!-- Category & Status Line -->
  <g transform="translate(20, 34)">
    <text x="0" y="0" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="8.5" font-weight="700" letter-spacing="1">AUTONOMOUS SYSTEMS • MULTI-AGENT ORCHESTRATION</text>
    
    <!-- Status Pill -->
    <rect x="300" y="-10" width="110" height="15" rx="3" fill="#030712" stroke="#10B981" stroke-width="0.8"/>
    <circle cx="308" cy="-2.5" r="2.5" fill="#10B981"/>
    <text x="316" y="0" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="7.5" font-weight="700" letter-spacing="0.5">PRODUCTION READY</text>
  </g>

  <!-- Project Icon & Title Header -->
  <g transform="translate(20, 48)">
    <g transform="translate(0, 0)">
      <circle cx="16" cy="16" r="10" fill="none" stroke="#A855F7" stroke-width="2"/><circle cx="16" cy="16" r="4" fill="#C084FC"/><path d="M16 6v4M16 22v4M6 16h4M22 16h4" stroke="#A855F7" stroke-width="2"/>
    </g>
    <text x="38" y="21" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" letter-spacing="0.2">AgentMart // Multi-Agent Engine</text>
  </g>

  <!-- Project Description (wrapped visually) -->
  <g transform="translate(20, 88)">
    <text x="0" y="14" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" width="410">
      <tspan x="0" dy="0">Autonomous multi-agent system featuring dynamic role dispatch, goal decomposition, and</tspan>
      <tspan x="0" dy="16">secure tool execution via Model Context Protocol (MCP).</tspan>
    </text>
  </g>

  <!-- Technology Tags Footer -->
  <g transform="translate(20, 142)">
    
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="61.0" height="20" rx="4" fill="#0f172a" stroke="#A855F7" stroke-width="0.8"/>
          <text x="30.5" y="13.5" text-anchor="middle" fill="#C084FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="700">Python</text>
        </g>
        
        <g transform="translate(69.0, 0)">
          <rect x="0" y="0" width="83.5" height="20" rx="4" fill="#0f172a" stroke="#A855F7" stroke-width="0.8"/>
          <text x="41.75" y="13.5" text-anchor="middle" fill="#C084FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="700">LangGraph</text>
        </g>
        
        <g transform="translate(160.5, 0)">
          <rect x="0" y="0" width="38.5" height="20" rx="4" fill="#0f172a" stroke="#A855F7" stroke-width="0.8"/>
          <text x="19.25" y="13.5" text-anchor="middle" fill="#C084FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="700">MCP</text>
        </g>
        
        <g transform="translate(207.0, 0)">
          <rect x="0" y="0" width="68.5" height="20" rx="4" fill="#0f172a" stroke="#A855F7" stroke-width="0.8"/>
          <text x="34.25" y="13.5" text-anchor="middle" fill="#C084FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="700">FastAPI</text>
        </g>
        
  </g>

  <!-- Corner Decals -->
  <path d="M 4 25 L 4 4 L 25 4" fill="none" stroke="#A855F7" stroke-width="2.5"/>
  <path d="M 446 25 L 446 4 L 425 4" fill="none" stroke="#A855F7" stroke-width="2.5"/>
  <path d="M 4 165 L 4 186 L 25 186" fill="none" stroke="#A855F7" stroke-width="2.5"/>
  <path d="M 446 165 L 446 186 L 425 186" fill="none" stroke="#A855F7" stroke-width="2.5"/>
</svg>