<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="statsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19"/>
      <stop offset="50%" stop-color="#0b102c"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>

    <!-- Neon Rim Border -->
    <linearGradient id="statsBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>

    <!-- Metric Glow Filters -->
    <filter id="hudGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <linearGradient id="barPython" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="barJupyter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="barTS" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <!-- Chassis Frame -->
  <rect x="4" y="4" width="912" height="232" rx="16" fill="url(#statsBg)" stroke="url(#statsBorder)" stroke-width="1.8" filter="url(#hudGlow)"/>

  <!-- Top Cyber Status Bar -->
  <g transform="translate(25, 20)">
    <rect x="0" y="0" width="180" height="20" rx="4" fill="#030712" stroke="#00f0ff" stroke-width="0.8"/>
    <circle cx="10" cy="10" r="3.5" fill="#00f0ff">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="20" y="14" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="700" letter-spacing="1">TELEMETRY // VERIFIED SNAPSHOT</text>
    
    <text x="730" y="14" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9.5" font-weight="600" letter-spacing="1">USER: MOEENUDDIN01</text>
  </g>

  <!-- Divider Line -->
  <line x1="25" y1="52" x2="895" y2="52" stroke="#1e293b" stroke-width="1"/>

  <!-- ==================== LEFT COLUMN: CORE ACTIVITY METRICS ==================== -->
  
  <g transform="translate(35, 75)">
    <!-- Metric 1: Total Contributions -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="190" height="60" rx="8" fill="#0b112c" stroke="#00f0ff" stroke-width="0.8"/>
      <text x="16" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1">CONTRIBUTIONS (PAST 12 MO)</text>
      <text x="16" y="48" fill="#00f0ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900">1,060+</text>
      <circle cx="165" cy="30" r="10" fill="#070b19" stroke="#00f0ff" stroke-width="1"/>
      <path d="M162 30l3 3 5-5" stroke="#00f0ff" stroke-width="1.8" fill="none"/>
    </g>

    <!-- Metric 2: Public Repositories -->
    <g transform="translate(205, 0)">
      <rect x="0" y="0" width="190" height="60" rx="8" fill="#0b112c" stroke="#a855f7" stroke-width="0.8"/>
      <text x="16" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1">PUBLIC REPOSITORIES</text>
      <text x="16" y="48" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900">39 Public</text>
      <circle cx="165" cy="30" r="10" fill="#070b19" stroke="#a855f7" stroke-width="1"/>
      <circle cx="165" cy="30" r="4" fill="#a855f7"/>
    </g>

    <!-- Metric 3: Primary Domain -->
    <g transform="translate(0, 72)">
      <rect x="0" y="0" width="190" height="60" rx="8" fill="#0b112c" stroke="#a855f7" stroke-width="0.8"/>
      <text x="16" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1">PRIMARY FOCUS</text>
      <text x="16" y="47" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800">Agentic AI &amp; RAG</text>
      <text x="140" y="47" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10" font-weight="700">CORE</text>
    </g>

    <!-- Metric 4: System Reliability -->
    <g transform="translate(205, 72)">
      <rect x="0" y="0" width="190" height="60" rx="8" fill="#0b112c" stroke="#10b981" stroke-width="0.8"/>
      <text x="16" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1">STATUS INDICATOR</text>
      <text x="16" y="47" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800">Active Engineer</text>
      <circle cx="170" cy="42" r="4" fill="#10b981"/>
    </g>
  </g>

  <!-- Vertical Divider -->
  <line x1="465" y1="65" x2="465" y2="215" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="4 4"/>

  <!-- ==================== RIGHT COLUMN: LANGUAGE TELEMETRY ==================== -->
  
  <g transform="translate(490, 75)">
    <text x="0" y="10" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="700" letter-spacing="1">PRIMARY REPO DISTRIBUTION (38 LABELED)</text>

    <!-- Lang 1: Python -->
    <g transform="translate(0, 24)">
      <text x="0" y="12" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Python (26 Public Repos)</text>
      <text x="380" y="12" text-anchor="end" fill="#00f0ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="700">68.4%</text>
      <!-- Bar Background -->
      <rect x="0" y="18" width="380" height="7" rx="3.5" fill="#0f172a"/>
      <!-- Bar Progress -->
      <rect x="0" y="18" width="260" height="7" rx="3.5" fill="url(#barPython)"/>
    </g>

    <!-- Lang 2: Jupyter / Data Science / Models -->
    <g transform="translate(0, 56)">
      <text x="0" y="12" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Jupyter / Deep Learning (8 Repos)</text>
      <text x="380" y="12" text-anchor="end" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="700">21.1%</text>
      <rect x="0" y="18" width="380" height="7" rx="3.5" fill="#0f172a"/>
      <rect x="0" y="18" width="80" height="7" rx="3.5" fill="url(#barJupyter)"/>
    </g>

    <!-- Lang 3: TypeScript / Systems -->
    <g transform="translate(0, 88)">
      <text x="0" y="12" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">TypeScript / Full-Stack (2 Repos)</text>
      <text x="380" y="12" text-anchor="end" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="700">5.3%</text>
      <rect x="0" y="18" width="380" height="7" rx="3.5" fill="#0f172a"/>
      <rect x="0" y="18" width="24" height="7" rx="3.5" fill="url(#barTS)"/>
    </g>

    <!-- Lang 4: Shell / Robotics / Other -->
    <g transform="translate(0, 120)">
      <text x="0" y="12" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Shell, JS &amp; Other (2 Repos)</text>
      <text x="380" y="12" text-anchor="end" fill="#facc15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="700">5.2%</text>
      <rect x="0" y="18" width="380" height="7" rx="3.5" fill="#0f172a"/>
      <rect x="0" y="18" width="20" height="7" rx="3.5" fill="#facc15"/>
    </g>
  </g>

  <!-- Cyber Corners -->
  <path d="M 4 25 L 4 4 L 25 4" fill="none" stroke="#00f0ff" stroke-width="2.5"/>
  <path d="M 916 25 L 916 4 L 895 4" fill="none" stroke="#a855f7" stroke-width="2.5"/>
  <path d="M 4 215 L 4 236 L 25 236" fill="none" stroke="#a855f7" stroke-width="2.5"/>
  <path d="M 916 215 L 916 236 L 895 236" fill="none" stroke="#00f0ff" stroke-width="2.5"/>
</svg>
