<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 190" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg_2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19"/>
      <stop offset="60%" stop-color="#0a0f26"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    <linearGradient id="borderGrad_2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="cardGlow_2" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Card Chassis -->
  <rect x="4" y="4" width="442" height="182" rx="14" fill="url(#cardBg_2)" stroke="url(#borderGrad_2)" stroke-width="1.6" filter="url(#cardGlow_2)"/>

  <!-- Top Cyber Accent Bar -->
  <path d="M 18 4 L 80 4 L 90 14 L 18 14 Z" fill="#F59E0B" opacity="0.85"/>
  <text x="24" y="12" fill="#070b19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="7.5" font-weight="900" letter-spacing="1">FEATURED</text>

  <!-- Category & Status Line -->
  <g transform="translate(20, 34)">
    <text x="0" y="0" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="8.5" font-weight="700" letter-spacing="1">ROBOTICS &amp; SIMULATION • PREDICTIVE AI</text>
    
    <!-- Status Pill -->
    <rect x="300" y="-10" width="110" height="15" rx="3" fill="#030712" stroke="#10B981" stroke-width="0.8"/>
    <circle cx="308" cy="-2.5" r="2.5" fill="#10B981"/>
    <text x="316" y="0" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="7.5" font-weight="700" letter-spacing="0.5">TELEMETRY VERIFIED</text>
  </g>

  <!-- Project Icon & Title Header -->
  <g transform="translate(20, 48)">
    <g transform="translate(0, 0)">
      <path d="M6 24h20M12 24V14l8-6 4 3-7 5v8" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="11" r="2.5" fill="#FCD34D"/>
    </g>
    <text x="38" y="21" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" letter-spacing="0.2">AegisArm // Robotics AI</text>
  </g>

  <!-- Project Description (wrapped visually) -->
  <g transform="translate(20, 88)">
    <text x="0" y="14" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" width="410">
      <tspan x="0" dy="0">Closed-loop robotic predictive maintenance simulator combining PyTorch deep LSTMs</tspan>
      <tspan x="0" dy="16">and PyBullet 6-DOF physics for real-time failure prevention.</tspan>
    </text>
  </g>

  <!-- Technology Tags Footer -->
  <g transform="translate(20, 142)">
    
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="68.5" height="20" rx="4" fill="#0f172a" stroke="#F59E0B" stroke-width="0.8"/>
          <text x="34.25" y="13.5" text-anchor="middle" fill="#FCD34D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="700">PyTorch</text>
        </g>
        
        <g transform="translate(76.5, 0)">
          <rect x="0" y="0" width="76.0" height="20" rx="4" fill="#0f172a" stroke="#F59E0B" stroke-width="0.8"/>
          <text x="38.0" y="13.5" text-anchor="middle" fill="#FCD34D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="700">PyBullet</text>
        </g>
        
        <g transform="translate(160.5, 0)">
          <rect x="0" y="0" width="46.0" height="20" rx="4" fill="#0f172a" stroke="#F59E0B" stroke-width="0.8"/>
          <text x="23.0" y="13.5" text-anchor="middle" fill="#FCD34D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="700">LSTM</text>
        </g>
        
        <g transform="translate(214.5, 0)">
          <rect x="0" y="0" width="91.0" height="20" rx="4" fill="#0f172a" stroke="#F59E0B" stroke-width="0.8"/>
          <text x="45.5" y="13.5" text-anchor="middle" fill="#FCD34D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="700">Simulation</text>
        </g>
        
  </g>

  <!-- Corner Decals -->
  <path d="M 4 25 L 4 4 L 25 4" fill="none" stroke="#F59E0B" stroke-width="2.5"/>
  <path d="M 446 25 L 446 4 L 425 4" fill="none" stroke="#F59E0B" stroke-width="2.5"/>
  <path d="M 4 165 L 4 186 L 25 186" fill="none" stroke="#F59E0B" stroke-width="2.5"/>
  <path d="M 446 165 L 446 186 L 425 186" fill="none" stroke="#F59E0B" stroke-width="2.5"/>
</svg>