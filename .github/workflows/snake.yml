name: Generate Contribution Snake Animation

on:
  schedule:
    # Run automatically every 24 hours at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

# Minimum permissions: only contents write is needed to push to the output branch
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        # actions/checkout v4.2.2 (pinned to verified commit SHA)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # Generates contribution snake SVG animations from GitHub calendar
      - name: Generate Snake Animation SVGs
        # Platane/snk v3.2.0 (pinned to verified commit SHA)
        uses: Platane/snk/svg-only@8b7b3e6acef87188f941ed83b47f9da0401b4d17
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Push generated SVGs to the 'output' branch
      - name: Deploy SVGs to Output Branch
        # crazy-max/ghaction-github-pages v3.1.0 (pinned to verified commit SHA)
        uses: crazy-max/ghaction-github-pages@c0d7ff0487ee0415efb7f32dab10ea880330b1dd
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
